name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build + test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build dist/
        run: python3 build.py

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t interaction-lab:ci .

      - name: Smoke test the container
        run: |
          docker run -d --name ilab -p 8900:8900 interaction-lab:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8900/api/health; then
              echo "container healthy"
              exit 0
            fi
            sleep 2
          done
          docker logs ilab
          exit 1
